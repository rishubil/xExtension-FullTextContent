services:
  tests:
    image: ftc-integration-tests:${FRESHRSS_VERSION:-1.30.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRESHRSS_VERSION: "${FRESHRSS_VERSION:-1.30.1}"
        DEFUDDLE_VERSION: "0.19.5"
        OBSCURA_VERSION: "v0.2.4"
    user: root
    entrypoint: ""
    command:
      - bash
      - /var/www/FreshRSS/extensions/xExtension-FullTextContent/tests/integration/run-in-container.sh
    environment:
      DATA_PATH: /var/www/FreshRSS/data
      TEST_DEPS_DIR: /opt/test-deps
      FRESHRSS_EXPECTED_VERSION: "${FRESHRSS_VERSION:-1.30.1}"
    volumes:
      - type: bind
        source: ../..
        target: /var/www/FreshRSS/extensions/xExtension-FullTextContent
        read_only: true
      - freshrss_data:/var/www/FreshRSS/data

volumes:
  freshrss_data:
